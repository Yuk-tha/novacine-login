<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NovaCine</title>
    <script>
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var redirect = path.slice(1) + search + hash;
      sessionStorage.setItem('redirect', redirect);
      window.location.replace('/novacine-login/');
    </script>
  </head>
  <body></body>
</html>
